name: Build Windows exe

# Chay khi push len nhanh main, hoac bam nut "Run workflow" thu cong trong tab Actions.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build installer + portable exe
        run: npm run build:win

      # electron-builder xuat file vao thu muc dist/ (installer .exe va portable .exe)
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: lobehub-account-manager-windows
          path: |
            dist/*.exe
          if-no-files-found: error
